# ILLUSTRATIVE BANK — NOT A REAL INSTITUTION. Every number below is an assumption chosen to look like a
# mid-sized US commercial bank; none is taken from FRED or any filing. Units: USD billions, rates in %.
# Calibrated to the 2026-09 yield curve level so the starting position is plausible. Changing these
# moves every IRRBB result, which is why sensitivity analysis is part of the engine (see tornado).
meta:
  label: "Illustrative bank (assumptions, not data)"
  currency: USD
  tier1_capital: 9.0
assets:
  cash: {balance: 8.0, spread_bp: -25}            # reserves earn overnight rate less 25bp
  securities:                                      # fixed-rate bullets, semi-annual coupon
    - {name: ust_2y,  balance: 5.0, coupon: 3.60, remaining_years: 2.0}
    - {name: ust_5y,  balance: 8.0, coupon: 3.90, remaining_years: 5.0}
    - {name: agency_10y, balance: 5.0, coupon: 4.40, remaining_years: 10.0}
  mortgages:                                       # 30y fixed, level-pay, S-curve prepayment
    balance: 30.0
    wac: 5.00
    remaining_years: 25.0
    market_spread_bp: 140                          # mortgage rate = 10y zero + spread
    cpr: {min: 0.04, max: 0.40, steepness_per_pp: 2.0, midpoint_incentive_pp: 1.0}
  commercial_floating: {balance: 25.0, spread_bp: 200, reprice_months: 1}   # SOFR + 200bp
  consumer: {balance: 12.0, rate: 7.20, wam_years: 4.0, cpr: 0.10}
  other_assets: {balance: 7.0}                     # non-interest-earning
liabilities:
  retail_transactional:     {balance: 18.0, rate: 0.05, core_share: 0.80, core_avg_maturity: 4.0}
  retail_non_transactional: {balance: 27.0, rate: 0.45, core_share: 0.60, core_avg_maturity: 3.0}
  wholesale_nmd:            {balance: 10.0, rate: 3.00, core_share: 0.40, core_avg_maturity: 2.0}
  term_deposits:            {balance: 16.0, rate: 1.70, runoff_months: 12}      # uniform runoff, avg 6m
  wholesale_funding:        {balance: 16.0, spread_bp: 40, reprice_months: 3}   # SOFR + 40bp
  other_liabilities:        {balance: 3.0}
equity: 10.0
deposit_response:
  adjustment_months: 3.0     # ASSUMPTION: exponential pass-through time-constant of deposit rates in the NII engine
  beta_multiplier: 1.0       # scales measured betas (used by the sensitivity analysis)
